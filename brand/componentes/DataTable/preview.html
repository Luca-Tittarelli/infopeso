<!-- @dsCard group="Datos" height=300 subtitle="Tabla de especies (valores de ejemplo)" -->
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>body{margin:0;background:var(--ground-000)}</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .wrap{background:var(--ground-000);padding:var(--space-6)}
  .box{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-md);overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:520px}
  th{font:500 12px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);text-align:right;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--line);font:400 14px/1.4 var(--font-mono);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--surface-200)}
  .tk{font:700 15px/1.2 var(--font-display);letter-spacing:-.01em}
  .name{display:block;font:400 12px/1.3 var(--font-display);color:var(--ink-subtle)}
  .d{display:inline-flex;align-items:center;gap:var(--space-1)}
  .d svg{width:9px;height:8px}
  .up{color:var(--signal-text)} .up svg{fill:var(--up)}
  .down{color:var(--down)} .down svg{fill:var(--down)}
  .muted{color:var(--ink-muted)}
</style>
<div class="wrap">
  <div class="box">
    <table>
      <thead><tr><th scope="col">Especie</th><th scope="col">Último</th><th scope="col">Var. diaria</th><th scope="col">Volumen</th></tr></thead>
      <tbody>
        <tr><td><span class="tk">AAAA</span><span class="name">Especie de ejemplo A</span></td><td>1.234,50</td><td><span class="d up" aria-label="sube 2,15 por ciento"><svg viewBox="0 0 10 9" aria-hidden="true"><polygon points="5,0 10,9 0,9"></polygon></svg>+2,15 %</span></td><td class="muted">12,3 M</td></tr>
        <tr><td><span class="tk">BBBB</span><span class="name">Especie de ejemplo B</span></td><td>876,00</td><td><span class="d down" aria-label="baja 0,80 por ciento"><svg viewBox="0 0 10 9" aria-hidden="true"><polygon points="0,0 10,0 5,9"></polygon></svg>−0,80 %</span></td><td class="muted">4,1 M</td></tr>
        <tr><td><span class="tk">CCCC</span><span class="name">Especie de ejemplo C</span></td><td>—</td><td class="muted">—</td><td class="muted">—</td></tr>
      </tbody>
    </table>
  </div>
</div>
<script></script>
