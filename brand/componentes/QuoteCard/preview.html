<!-- @dsCard group="Datos" height=240 subtitle="Tarjeta de cotización (valores de ejemplo)" -->
<link rel="stylesheet" href="../../tokens/tokens.css">
<style>body{margin:0;background:var(--ground-000)}</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .wrap{background:var(--ground-000);padding:var(--space-6);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-4);font-family:var(--font-display)}
  .card{background:var(--surface-100);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3)}
  .label{font:500 12px/1.3 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-subtle);margin:0}
  .value{font:700 40px/1 var(--font-display);letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;margin:0}
  .row{display:flex;justify-content:space-between;align-items:center}
  .delta{display:inline-flex;align-items:center;gap:var(--space-1);font:500 14px/1 var(--font-mono);padding:6px 10px;border-radius:var(--radius-pill);background:var(--surface-200)}
  .delta svg{width:10px;height:9px}
  .up{color:var(--signal-text)} .up svg{fill:var(--up)}
  .down{color:var(--down)} .down svg{fill:var(--down)}
  .time{font:400 12px/1 var(--font-mono);color:var(--ink-subtle)}
</style>
<div class="wrap">
  <article class="card">
    <p class="label">Dólar MEP · venta</p>
    <p class="value">$ 1.234,50</p>
    <div class="row">
      <span class="delta up" aria-label="sube 2,15 por ciento"><svg viewBox="0 0 10 9" aria-hidden="true"><polygon points="5,0 10,9 0,9"></polygon></svg>+2,15 %</span>
      <span class="time">14:32</span>
    </div>
  </article>
  <article class="card">
    <p class="label">Riesgo país</p>
    <p class="value">1.234 <span style="font-size:20px;color:var(--ink-muted)">pb</span></p>
    <div class="row">
      <span class="delta down" aria-label="baja 12 puntos básicos"><svg viewBox="0 0 10 9" aria-hidden="true"><polygon points="0,0 10,0 5,9"></polygon></svg>−12 pb</span>
      <span class="time">14:30</span>
    </div>
  </article>
</div>
<script></script>
